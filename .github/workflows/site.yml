name: site

# Builds the documentation site from README.md, SECURITY.md, and docs/. The build
# fails when a Markdown link names no page, heading, or image. A pull request
# builds the site. The main branch and a manual run with deploy publish it to
# GitHub Pages.
on:
  push:
    branches: [main]
    # Only these inputs change the site. AGENTS.md section 5.1 asks for low CI usage.
    paths:
      - "site/**"
      - "docs/**"
      - "README.md"
      - "SECURITY.md"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - "README.md"
      - "SECURITY.md"
      - ".github/workflows/site.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publish the site from the selected branch"
        type: boolean
        default: false

# One run at a time for each ref. A new run cancels the running one.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly

jobs:
  build:
    name: build site
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            site/go.sum
            site/hugo.version
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Install Hugo
        run: go install "github.com/gohugoio/hugo@$(cat site/hugo.version)"
      - name: Build site
        working-directory: site
        env:
          HUGO_PARAMS_REPO: ${{ github.server_url }}/${{ github.repository }}
          HUGO_PARAMS_REPOREF: ${{ github.sha }}
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/public

  deploy:
    name: deploy site
    needs: build
    if: github.ref == 'refs/heads/main' || inputs.deploy == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5
