baseURL: https://gfire-sigs.github.io/gvx/
title: gvx
defaultContentLanguage: en
disableKinds:
  - taxonomy
  - term

# The mounted files have no front matter, so the site sets their titles and order here.
cascade:
  - target:
      path: "/docs/cli"
    title: CLI reference
    weight: 10
  - target:
      path: "/docs/recipes"
    weight: 20
  - target:
      path: "/docs/recipes/docker-engine"
    title: Docker Engine recipe
  - target:
      path: "/docs/recipes/kubernetes"
    title: Kubernetes recipe
  - target:
      path: "/docs/architecture"
    title: Architecture
    weight: 30
  - target:
      path: "/docs/control-protocol"
    title: Control protocol
    weight: 40
  - target:
      path: "/docs/systrap-windows"
    title: Windows systrap
    weight: 50
  - target:
      path: "/docs/moonshots"
    title: Moonshots
    weight: 60
  - target:
      path: "/security"
    title: Security policy

module:
  # The proxy verifies each download against go.sum.
  proxy: https://proxy.golang.org
  imports:
    - path: github.com/imfing/hextra
  mounts:
    - source: content
      target: content
    # "**/*.md" omits the files at the root of the mount.
    - source: ../docs
      target: content/docs
      files:
        - "*.md"
        - "**/*.md"
    - source: assets
      target: assets
    - source: ../docs/assets
      target: assets/docs/assets
    - source: ../README.md
      target: content/_index.md
    - source: ../SECURITY.md
      target: content/SECURITY.md

markup:
  highlight:
    noClasses: false

params:
  navbar:
    displayLogo: false
  page:
    width: wide
  imageZoom:
    enable: true
  repo: https://github.com/gfire-sigs/gvx
  repoRef: main
  repoOnlyMarkdown:
    - AGENTS.md
    - CHANGELOG.md
  search:
    enable: true
    type: flexsearch

menu:
  main:
    - name: Docs
      pageRef: /docs
      weight: 10
    - name: CLI
      pageRef: /docs/cli
      weight: 20
    - name: Search
      weight: 30
      params:
        type: search
    - name: GitHub
      url: https://github.com/gfire-sigs/gvx
      weight: 40
      params:
        icon: github
